version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veyrqun-backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=*
      - VEYRQUN_DB_FILE=/data/veyrqun.db
    volumes:
      - veyrqun-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veyrqun-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  veyrqun-data:

networks:
  default:
    name: veyrqun-network
