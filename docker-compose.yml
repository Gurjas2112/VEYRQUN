name: veyrqun

# `docker compose up -d postgres redis` gives the data services for local development and tests.
# `docker compose up --build` runs the whole stack. Later phases add the gateway, audit writer,
# Keycloak and observability under profiles.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: veyrqun_owner
      POSTGRES_PASSWORD: veyrqun_owner_dev   # dev only; real deployments read secrets from the platform
      POSTGRES_DB: veyrqun
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyrqun_owner -d veyrqun"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin            # dev only
      KC_DASHBOARD_CLIENT_SECRET: ${KC_DASHBOARD_CLIENT_SECRET:-dev-dashboard-secret}
      KC_HOSTNAME: http://localhost:8180            # issuer the browser and the control plane agree on
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"       # containers may reach it as http://keycloak:8080
    ports:
      - "8180:8080"
    volumes:
      - ./deploy/keycloak/realm-veyrqun.json:/opt/keycloak/data/import/realm-veyrqun.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://veyrqun_app:veyrqun_app_dev@postgres:5432/veyrqun
      MIGRATION_DATABASE_URL: postgresql+psycopg://veyrqun_owner:veyrqun_owner_dev@postgres:5432/veyrqun
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
      VEYRQUN_ENV: dev
      BUNDLE_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev-gateway-token}
      OIDC_ISSUER: http://localhost:8180/realms/veyrqun
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/veyrqun/.well-known/openid-configuration
      OIDC_CLIENT_SECRET: ${KC_DASHBOARD_CLIENT_SECRET:-dev-dashboard-secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev-gateway-token}
      REDIS_URL: redis://redis:6379/0
      UPSTREAM_LLM_URLS: http://mock-llm:9101
      UPSTREAM_MCP_URL: http://mock-mcp:9102/mcp
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started

  # Single active consumer of gateway decision events (Redis lease); safe to scale, extra replicas stand by.
  audit-writer:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    command: ["python", "-m", "veyrqun.audit_writer"]
    environment:
      DATABASE_URL: postgresql+psycopg://veyrqun_app:veyrqun_app_dev@postgres:5432/veyrqun
      REDIS_URL: redis://redis:6379/0
      VEYRQUN_ENV: dev
      AUDIT_ANCHOR_INTERVAL_S: "60"
    healthcheck:  # the image's default probes the API port; the writer reports a heartbeat to Redis instead
      test: ["CMD", "python", "-c", "import sys,time,redis; h=redis.Redis.from_url('redis://redis:6379/0').hget('vq:audit-writer:status','heartbeat'); sys.exit(0 if h and time.time()-int(h)<30 else 1)"]
      interval: 15s
      timeout: 3s
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started

  mock-llm:
    build:
      context: .
      dockerfile: gateway/Dockerfile.mocks
    environment: { MOCK: llm, PORT: "9101" }

  mock-mcp:
    build:
      context: .
      dockerfile: gateway/Dockerfile.mocks
    environment: { MOCK: mcp, PORT: "9102" }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - control-plane

volumes:
  pgdata:
