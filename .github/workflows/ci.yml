name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPA_VERSION: "1.21.3"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Rego format, strict check, tests
        run: |
          opa fmt --fail --list policies/
          opa check --strict policies/
          opa test policies/ -v
      - name: Compiled policy.wasm is up to date
        run: python scripts/build_policy.py --check
      - name: Generated boundary tests are up to date
        run: python scripts/gen_policy_tests.py --check

  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: veyrqun_owner
          POSTGRES_PASSWORD: veyrqun_owner_dev
          POSTGRES_DB: veyrqun
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veyrqun_owner -d veyrqun" --health-interval 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      TEST_PG_PORT: "5432"
      TEST_REDIS_URL: redis://localhost:6379/15
      PGPASSWORD: veyrqun_owner_dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the migration test rebuilds a v2 database from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Create runtime role (as in deploy/postgres/init)
        run: psql -h localhost -U veyrqun_owner -d veyrqun -f deploy/postgres/init/01-roles.sql
      - name: Lint
        run: ruff check .
      - name: README results table matches docs/results
        run: python scripts/render_results.py --check
      - name: Tests (Postgres + Redis integration, 10k-case Rego/Lua parity, migration validation)
        run: python -m pytest -q

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (python, security-audit, secrets)
        run: >
          semgrep scan --config p/python --config p/security-audit --config p/secrets --metrics=off --error
          --exclude frontend/node_modules --exclude tools --exclude app_screenshots_screen_recording

  e2e-identity:
    runs-on: ubuntu-latest
    needs: [control-plane]
    env:
      KC_DASHBOARD_CLIENT_SECRET: ci-dashboard-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - name: Start Postgres, Redis and Keycloak (realm imported from deploy/keycloak)
        run: |
          docker compose up -d postgres redis keycloak
          for i in $(seq 1 90); do curl -sf localhost:8180/realms/veyrqun/.well-known/openid-configuration && break; sleep 2; done
      - name: Seed dev users (random passwords + TOTP, never committed)
        run: python deploy/keycloak/seed_dev_users.py --out .dev-users.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm --prefix gateway ci --no-audit --no-fund
      - name: Playwright e2e (login, invites, MFA, sandbox, logout) + control-plane/gateway interop
        run: python -m pytest e2e -q
      - name: Guardrail eval regression gate (no must-block case may pass, benign FPR may not rise)
        run: python -m evals.run --gate --no-write
      - name: OWASP ZAP API scan (OpenAPI-driven) against the running control plane
        run: |
          cd control-plane
          DATABASE_URL=postgresql+psycopg://veyrqun_app:veyrqun_app_dev@localhost:55432/veyrqun_e2e           REDIS_URL=redis://localhost:56379/12 VEYRQUN_SIMULATOR=0 OIDC_ISSUER=http://localhost:8180/realms/veyrqun             nohup python -m uvicorn app:app --port 8000 > ../zap-target.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          docker run --rm --network host --user root -v "$PWD/..:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable             zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi -I -r zap-report.html -J zap-report.json
          cd .. && python scripts/summarize_zap.py zap-report.json --out zap-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-and-zap-reports
          path: |
            zap-report.html
            zap-report.json
            zap-summary.json
            e2e/control-plane.log

  gateway:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit + failure-contract tests (real Redis, real policy.wasm)
        run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [control-plane, gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -f control-plane/Dockerfile -t veyrqun/control-plane:ci .
      - name: Build gateway image
        run: docker build -f gateway/Dockerfile -t veyrqun/gateway:ci .

  helm:
    name: helm (lint, kind install, helm test)
    runs-on: ubuntu-latest
    needs: [control-plane, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.22.0 }
      - name: Lint (defaults and GKE values)
        run: |
          helm lint deploy/helm/veyrqun
          helm lint deploy/helm/veyrqun -f deploy/helm/veyrqun/values-gke.yaml             --set demo.expiresAt=2030-01-01T00:00:00Z --set ingress.host=ci.example.com --set demo.scaleDownSchedule="0 0 1 1 *"
      - uses: helm/kind-action@v1
        with: { cluster_name: veyrqun, version: v0.33.0 }
      - name: Build and load images
        run: |
          docker build -q -f control-plane/Dockerfile -t veyrqun/control-plane:ci .
          docker build -q -f gateway/Dockerfile -t veyrqun/gateway:ci .
          docker build -q -f gateway/Dockerfile.mocks -t veyrqun/mocks:ci .
          docker build -q -t veyrqun/dashboard:ci frontend
          for i in control-plane gateway mocks dashboard; do kind load docker-image veyrqun/$i:ci --name veyrqun; done
      - name: Install and test
        run: |
          helm install veyrqun deploy/helm/veyrqun -n veyrqun --create-namespace --set image.tag=ci             --set controlPlane.replicas=1 --set gateway.autoscaling.enabled=false --set gateway.replicas=1             --set auditWriter.replicas=1 --set dashboard.replicas=1 --wait --timeout 10m
          helm test veyrqun -n veyrqun --logs --timeout 5m
      - name: Diagnostics on failure
        if: failure()
        run: kubectl -n veyrqun get pods -o wide; kubectl -n veyrqun describe pods | tail -80; kubectl -n veyrqun logs -l app.kubernetes.io/instance=veyrqun --all-containers --tail=40
