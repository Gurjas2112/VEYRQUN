name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPA_VERSION: "1.21.3"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Rego format, strict check, tests
        run: |
          opa fmt --fail --list policies/
          opa check --strict policies/
          opa test policies/ -v
      - name: Compiled policy.wasm is up to date
        run: python scripts/build_policy.py --check
      - name: Generated boundary tests are up to date
        run: python scripts/gen_policy_tests.py --check

  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: veyrqun_owner
          POSTGRES_PASSWORD: veyrqun_owner_dev
          POSTGRES_DB: veyrqun
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veyrqun_owner -d veyrqun" --health-interval 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      TEST_PG_PORT: "5432"
      TEST_REDIS_URL: redis://localhost:6379/15
      PGPASSWORD: veyrqun_owner_dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the migration test rebuilds a v2 database from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Create runtime role (as in deploy/postgres/init)
        run: psql -h localhost -U veyrqun_owner -d veyrqun -f deploy/postgres/init/01-roles.sql
      - name: Lint
        run: ruff check .
      - name: Tests (Postgres + Redis integration, 10k-case Rego/Lua parity, migration validation)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [control-plane]
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -f control-plane/Dockerfile -t veyrqun/control-plane:ci .
