{{- if not .Values.secrets.existingSecret }}
{{- /* Generated once, then reused on every upgrade (lookup), so keys and passwords never rotate by accident.
     Keys: postgres-owner-password, postgres-app-password, master-key (kid:base64(32)), lookup-key (base64(32)),
     bundle-service-token, metrics-token, oidc-client-secret. With external stores also: database-url,
     migration-database-url, redis-url. */}}
{{- $name := include "vq.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $d := dict }}
{{- if $existing }}{{- $d = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "vq.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-owner-password: {{ get $d "postgres-owner-password" | default (randAlphaNum 32 | b64enc) }}
  postgres-app-password: {{ get $d "postgres-app-password" | default (randAlphaNum 32 | b64enc) }}
  master-key: {{ get $d "master-key" | default (printf "k1:%s" (randBytes 32) | b64enc) }}
  lookup-key: {{ get $d "lookup-key" | default (randBytes 32 | b64enc) }}
  bundle-service-token: {{ get $d "bundle-service-token" | default (randAlphaNum 48 | b64enc) }}
  metrics-token: {{ get $d "metrics-token" | default (randAlphaNum 48 | b64enc) }}
  oidc-client-secret: {{ get $d "oidc-client-secret" | default (randAlphaNum 48 | b64enc) }}
{{- end }}
