{{- $fn := include "vq.fullname" . }}
{{- if .Values.postgres.bundled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-postgres-init
  labels: {{- include "vq.labels" . | nindent 4 }}
data:
  01-roles.sh: |
    #!/bin/sh
    # The runtime app role is separate from the owner, so the app can be denied UPDATE/DELETE on the audit ledger.
    set -eu
    psql -v ON_ERROR_STOP=1 -v app_pw="$PG_APP_PASSWORD" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    CREATE ROLE veyrqun_app LOGIN PASSWORD :'app_pw';
    GRANT CONNECT ON DATABASE veyrqun TO veyrqun_app;
    CREATE EXTENSION IF NOT EXISTS vector;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "vq.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "vq.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports: [{ name: pg, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "vq.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $fn }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "vq.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vq.selector" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: veyrqun_owner }
            - { name: POSTGRES_DB, value: veyrqun }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "vq.secretName" . }}, key: postgres-owner-password } }
            - name: PG_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "vq.secretName" . }}, key: postgres-app-password } }
          ports: [{ containerPort: 5432, name: pg }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "veyrqun_owner", "-d", "veyrqun"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "veyrqun_owner", "-d", "veyrqun"] }
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: init
          configMap: { name: {{ $fn }}-postgres-init, defaultMode: 0555 }
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
{{- end }}
{{- if .Values.redis.bundled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-redis
  labels: {{- include "vq.labels" . | nindent 4 }}
spec:
  selector: {{- include "vq.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-redis
  labels: {{- include "vq.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ $fn }}-redis
  replicas: 1
  selector:
    matchLabels: {{- include "vq.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vq.selector" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports: [{ containerPort: 6379, name: redis }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 20 }
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
{{- end }}
